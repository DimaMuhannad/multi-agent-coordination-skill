[pytest]
# Lives at the skill-repo root, deliberately NOT under assets/ -- assets/ is copied verbatim
# into every project that installs this skill, and those projects have their own test setup.
#
# pytest.ini rather than pyproject.toml: this repo is a template scaffold, not a distributable
# package, and a pyproject.toml would imply a packaging story that does not exist yet.

testpaths = assets/coordination/tools/dashboard/tests

markers =
    streamlit: requires streamlit to be installed (UI layer; skipped otherwise)
